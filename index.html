<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도메인/포트 일괄 스캐너 (API 연동)</title>
    <!-- 스타일(CSS)은 이전 버전과 동일하게 유지 (생략 없이 사용하세요) -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #fff; padding: 30px; border-radius: 10px; width: 100%; max-width: 800px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .domain-result { margin-top: 25px; border: 1px solid #dcdde1; border-radius: 8px; }
        .domain-header { background-color: #e8f4f8; padding: 15px; display: flex; justify-content: space-between; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        .status-open { color: #27ae60; font-weight: bold; }
        .status-closed { color: #e74c3c; font-weight: bold; }
        .status-loading { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌐 도메인 및 포트 점검 (백엔드 연동)</h2>
    <textarea id="inputData" rows="6" placeholder="naver.com&#10;google.com, 8080, 8443"></textarea>
    <button id="scanBtn">점검 시작</button>
    <div id="resultsContainer"></div>
</div>

<script>
    document.getElementById('scanBtn').addEventListener('click', async () => {
        const scanBtn = document.getElementById('scanBtn');
        const inputData = document.getElementById('inputData').value;
        const resultsContainer = document.getElementById('resultsContainer');
        
        const lines = inputData.split('\n');
        let targets = [];

        lines.forEach(line => {
            if (!line.trim()) return;
            let parts = line.split(',');
            let domain = parts[0].replace(/[^\w\.-]/g, '');
            if (!domain) return;
            
            let customPorts = [];
            for (let i = 1; i < parts.length; i++) {
                let p = parseInt(parts[i].replace(/[^\d]/g, ''), 10);
                if (!isNaN(p)) customPorts.push(p);
            }
            let ports = [...new Set([80, 443, ...customPorts])].sort((a, b) => a - b);
            targets.push({ domain, ports });
        });

        if (targets.length === 0) return alert('유효한 입력값이 없습니다.');

        resultsContainer.innerHTML = '';
        scanBtn.disabled = true;
        scanBtn.innerText = '검사 진행 중...';

        const processTarget = async (target, index) => {
            const { domain, ports } = target;
            const uniqueId = `block-${index}`;

            const block = document.createElement('div');
            block.className = 'domain-result';
            block.innerHTML = `
                <div class="domain-header">
                    <span>🌍 ${domain}</span>
                    <span id="ip-${uniqueId}">DNS 조회 중... ⏳</span>
                </div>
                <table>
                    <thead>
                        <tr><th width="20%">포트</th><th width="30%">접속 상태</th><th width="50%">웹 서비스 여부</th></tr>
                    </thead>
                    <tbody id="tbody-${uniqueId}"></tbody>
                </table>
            `;
            resultsContainer.appendChild(block);
            const tbody = document.getElementById(`tbody-${uniqueId}`);
            const ipSpan = document.getElementById(`ip-${uniqueId}`);

            // 1. IP 조회
            try {
                let res = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
                let data = await res.json();
                let aRecord = data.Answer ? data.Answer.find(ans => ans.type === 1) : null;
                
                if (aRecord) {
                    ipSpan.innerText = `IP: ${aRecord.data}`;
                } else {
                    ipSpan.innerText = 'IP 조회 실패';
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">IP를 찾을 수 없습니다.</td></tr>`;
                    return; 
                }
            } catch (e) {
                ipSpan.innerText = '네트워크 오류';
                return;
            }

            // 2. 백엔드 API를 호출하여 포트 검사
            for (let port of ports) {
                let portId = `${uniqueId}-${port}`;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${port}</strong></td>
                    <td id="status-${portId}" class="status-loading">API 호출 중...</td>
                    <td id="detail-${portId}">-</td>
                `;
                tbody.appendChild(tr);

                try {
                    // 브라우저가 아닌 '우리가 만든 백엔드'에 검사를 요청함
                    let response = await fetch(`/api/scan?domain=${domain}&port=${port}`);
                    let result = await response.json();

                    document.getElementById(`status-${portId}`).innerText = result.status;
                    document.getElementById(`status-${portId}`).className = result.isOpen ? "status-open" : "status-closed";
                    document.getElementById(`detail-${portId}`).innerText = result.detail || result.error;
                } catch (e) {
                    document.getElementById(`status-${portId}`).innerText = "API 통신 에러";
                    document.getElementById(`status-${portId}`).className = "status-closed";
                }
            }
        };

        for (let i = 0; i < targets.length; i++) {
            await processTarget(targets[i], i);
        }

        scanBtn.innerText = '점검 완료 (다시 검사하기)';
        scanBtn.disabled = false;
    });
</script>
</body>
</html>
